<style>
:root{--bg:#0A0B10;--bg-elevated:#14171E;--surface:rgba(255,255,255,.04);--surface-hover:rgba(255,255,255,.07);--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.16);--text:#F5F5F8;--text-secondary:#8E919C;--text-tertiary:#5C6068;--accent:#00E5FF;--accent-glow:rgba(0,229,255,.35);--accent-secondary:#FF6B35;--success:#4ADE80;--danger:#F87171;--gold:#FFD166;--card-shadow:0 8px 32px rgba(0,0,0,.28);--btn-shadow:0 4px 20px rgba(0,229,255,.28);--dock-bg:rgba(20,23,30,.85);--icon-bg:rgba(255,255,255,.06)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overscroll-behavior:none}
body{font-family:'Manrope',sans-serif;color:var(--text);font-weight:500;-webkit-font-smoothing:antialiased;line-height:1.45}
#app{position:relative;max-width:460px;margin:0 auto;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.screen{position:relative;z-index:1;flex:1;overflow-y:auto;scrollbar-width:none;padding:20px 16px 110px}
.screen::-webkit-scrollbar{display:none}
.hidden{display:none!important}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;transition:transform .15s ease,opacity .15s ease}
button:active,.tappable:active{transform:scale(.97)}
input,textarea{font-family:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;font-size:16px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow),0 0 20px rgba(0,229,255,.15)}
[data-theme="light"] input,[data-theme="light"] textarea{background:#F8FAFC}
textarea{resize:none;font-size:14px}
.icon{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;flex-shrink:0}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card{background:var(--surface);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:12px;box-shadow:var(--card-shadow);opacity:0;animation:fadeInUp .5s cubic-bezier(.4,0,.2,1) forwards}

@keyframes pulse{0%,100%{box-shadow:0 0 0 var(--accent-glow)}50%{box-shadow:0 0 22px var(--accent-glow)}}
.h1{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.15}

.sub{color:var(--text-secondary);font-size:14px;margin-top:4px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:20px;opacity:0;animation:fadeInUp .5s cubic-bezier(.4,0,.2,1) forwards}
.logo-mark{width:38px;height:38px;border-radius:11px;background:var(--icon-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-secondary));background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#0A0B0F;flex-shrink:0;margin-left:auto;box-shadow:0 4px 14px var(--accent-glow);overflow:hidden}

.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 20% 0%,rgba(0,229,255,.12),transparent 55%),radial-gradient(circle at 90% 100%,rgba(255,107,53,.08),transparent 55%),linear-gradient(135deg,rgba(0,229,255,.06),rgba(255,107,53,.03))}

.hero-title{font-size:24px;font-weight:800;margin:6px 0 16px;position:relative}
.btn-primary{background:var(--accent);color:#0A0B0F;font-weight:700;font-size:14px;padding:14px 22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--btn-shadow);position:relative}

.btn-secondary{background:var(--surface);border:1px solid var(--border-strong);color:var(--text);font-weight:700;font-size:14px;padding:14px 22px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;justify-content:center}

.btn-row{display:flex;gap:10px}

.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-card{position:relative}

.ring-row{display:flex;align-items:center;gap:16px}

.ex-icon svg{width:20px;height:20px}

.dots{display:flex;gap:4px;margin-left:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border-strong)}
.dot.done{background:var(--accent)}
.dock{position:fixed;bottom:16px;left:16px;right:16px;width:fit-content;max-width:calc(100% - 32px);margin:0 auto;display:flex;gap:2px;background:var(--dock-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:999px;padding:5px;padding-bottom:calc(5px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 8px 32px rgba(0,0,0,.28)}

.dock-btn{display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 12px;border-radius:999px;color:var(--text-secondary);font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0;min-width:0;transition:transform .15s,background-color .2s,color .2s}
.dock-btn.active{background:var(--accent);color:#0A0B0F;box-shadow:0 2px 12px var(--accent-glow)}
[data-theme="light"] .dock-btn.active{color:#FFF}
.dock svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.8;fill:none}
.ob-wrap{padding:24px 20px;height:100%;display:flex;flex-direction:column;position:relative;z-index:1}

.ob-opt.sel{border-color:var(--accent);background:var(--surface-hover)}
.ob-opt-title{font-weight:700;font-size:15px}
.ob-opt-sub{font-size:12px;color:var(--text-secondary);margin-top:2px}
.ob-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0}
.ob-opt.sel .ob-check{border-color:var(--accent);background:var(--accent);position:relative}
.ob-opt.sel .ob-check::after{content:'';position:absolute;left:6px;top:2px;width:5px;height:9px;border:solid #0A0B0F;border-width:0 2px 2px 0;transform:rotate(45deg)}

.ob-dots{display:flex;gap:6px;justify-content:center;margin:20px 0}
.ob-dot{width:8px;height:8px;border-radius:999px;background:var(--border-strong);transition:all .3s}
.ob-dot.active{width:24px;background:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(4px)}

.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;max-height:88vh;overflow-y:auto;scrollbar-width:none;background:var(--bg-elevated);border-radius:28px 28px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));z-index:51;transform:translateY(100%);transition:transform .4s cubic-bezier(.32,.72,0,1);border-top:1px solid var(--border-strong);box-shadow:0 -8px 40px rgba(0,0,0,.32)}

.sheet .h1{padding-right:44px}
.field-row{display:flex;gap:10px;margin:16px 0}
.field{flex:1}

.sheet-actions{display:flex;gap:10px;margin-top:8px}
.sheet-actions button{flex:1;text-align:center;justify-content:center}
.pr-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}

.pr-medal{font-size:20px;width:28px;text-align:center}
.workout-screen{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1)}
.workout-screen.show{transform:translateX(0)}
.workout-top{padding:calc(16px + env(safe-area-inset-top)) 16px 10px}

.workout-body{flex:1;overflow-y:auto;padding:16px;scrollbar-width:none}

.hint-card{background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.3);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--gold);margin-bottom:16px}

.rest-bar{position:fixed;top:0;left:0;right:0;max-width:460px;margin:0 auto;z-index:45;background:var(--bg-elevated);border-bottom:1px solid var(--border-strong);padding:calc(14px + env(safe-area-inset-top)) 18px 14px;transform:translateY(-100%);transition:transform .35s cubic-bezier(.32,.72,0,1);box-shadow:0 4px 24px rgba(0,0,0,.3)}
[data-theme="light"] .rest-bar{box-shadow:0 4px 24px rgba(15,23,42,.1)}
.rest-bar.show{transform:translateY(0)}
.rest-num{font-size:34px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.rest-track{width:100%;height:5px;border-radius:5px;background:var(--border);overflow:hidden;margin:10px 0 12px}
.rest-fill{height:100%;background:linear-gradient(90deg,var(--accent) 0%,var(--accent-secondary) 100%);background-size:200% 100%;animation:gradientShift 4s ease infinite;border-radius:5px;transition:width 1s linear}
.rest-dur{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.rest-dur-btn{padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.rest-dur-btn.sel{background:var(--accent);color:#0A0B0F;border-color:var(--accent)}
[data-theme="light"] .rest-dur-btn.sel{color:#FFF}
.heatmap-scroll{overflow-x:auto;scrollbar-width:none;margin:6px 0}

.hm-cell{width:11px;height:11px;border-radius:3px;background:var(--border)}
.legend{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:11px;color:var(--text-tertiary)}
.legend .hm-cell{width:9px;height:9px}
#hmTooltip{font-size:13px;color:var(--text);margin-top:8px;min-height:18px}
.spark{display:block;margin-top:4px}
.picker-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;margin-bottom:6px;background:var(--surface);border:1px solid var(--border)}
.freq-row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.freq-btn{width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1}
.freq-btn.sel{background:var(--accent);color:#0A0B0F;border-color:var(--accent)}
[data-theme="light"] .freq-btn.sel{color:#FFF}
.day-block{border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
.prog-cover{height:150px;border-radius:16px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.pd-screen{position:fixed;inset:0;z-index:35;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);scrollbar-width:none}
.pd-screen.show{transform:translateX(0)}
.pd-top{padding:calc(16px + env(safe-area-inset-top)) 16px 0}
.pd-back{display:inline-flex;align-items:center;gap:6px;color:var(--text-secondary);font-weight:700;font-size:13px;margin-bottom:12px}
.pd-cover{height:180px;border-radius:20px;margin-bottom:16px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.pd-body{padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.pd-day{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);gap:10px}
.pd-day:last-child{border-bottom:none}
.pd-day-exs{padding:6px 0 10px;display:none}
.pd-day-exs.open{display:block}
.pd-day-ex-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:var(--text-secondary);gap:10px}
.shimmer{background:linear-gradient(90deg,var(--surface-hover) 25%,var(--border-strong) 37%,var(--surface-hover) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:8px;height:14px;margin-bottom:8px}

.ai-tip{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.ai-tip:last-child{border-bottom:none}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ach-badge{aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--icon-bg);border:1px solid var(--border);opacity:.35;filter:grayscale(1);transition:all .3s}
.ach-badge.unlocked{background:linear-gradient(135deg,rgba(0,229,255,.25),rgba(255,107,53,.15));border-color:var(--accent);opacity:1;filter:none;box-shadow:0 0 12px var(--accent-glow)}
.premium-screen{position:fixed;inset:0;z-index:36;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);scrollbar-width:none}
.premium-screen.show{transform:translateX(0)}
.pf-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.pf-row:last-child{border-bottom:none}
.price-card{background:linear-gradient(135deg,rgba(0,229,255,.12),rgba(255,107,53,.08));border:1px solid var(--border-strong);border-radius:18px;padding:20px;text-align:center;margin:16px 0}
.pbadge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.8px;color:var(--accent);background:var(--icon-bg);padding:3px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;text-transform:uppercase}
.lockbox{position:relative}
.lockbox.locked .lk-content{filter:blur(6px);pointer-events:none;user-select:none}
.lk-over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.seg{display:flex;gap:8px;margin-bottom:4px}
.seg-b{flex:1;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-weight:700;font-size:14px}
.seg-b.sel{background:var(--accent);color:#0A0B0F;border-color:var(--accent)}
[data-theme="light"] .seg-b.sel{color:#FFF}

.m-row b{flex-shrink:0;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.m-row:last-child{border-bottom:none}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.pill{flex-shrink:0;padding:9px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-weight:700;font-size:13px;transition:all .25s ease}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

function emptyProfile(){ return {gender:null,age:null,height:null,weight:null,targetWeight:null,activity:null,weightHistory:[],measures:[]}; }
const STATE_VERSION=6;
function defaultState(){ return {version:STATE_VERSION,user:{goal:null,level:null,program:null,name:firstName(),customPrograms:[],restTime:90,isPremium:false,profile:emptyProfile(),questPoints:0,streakFreezes:1,frozenDays:[],freezeLastGrant:null,premiumFreezeGrant:null,playlists:[],activePlaylist:0,reminders:null},quests:{date:null,items:[],completedCount:0},waterLog:{date:null,ml:0},waterHistory:[],sleepLog:{date:null,hours:0},sleepHistory:[],dailyCalories:[],theme:'dark',workouts:[],currentDayIndex:0,points:0,onboardingDone:false,achievements:[]}; }
let state = loadState();
function loadState(){
  try{
    const raw=localStorage.getItem('gymflow_state');
    if(!raw) return defaultState();
    const s=JSON.parse(raw);
    if(s && typeof s==='object'){ migrate(s); return s; }
  }catch(e){
    try{
      localStorage.setItem('gymflow_state_corrupt_'+Date.now(), localStorage.getItem('gymflow_state')||'');
      localStorage.removeItem('gymflow_state');
    }catch(_){}
    console.error('[GymFlow] state corrupted, backed up and reset', e);
  }
  return defaultState();
}
function migrate(s){
if(s.version===STATE_VERSION) return;
s.version=STATE_VERSION;
if(!s.user) s.user={};
if(!s.user.customPrograms) s.user.customPrograms=[];
if(!s.user.restTime) s.user.restTime=90;
if(s.user.isPremium===undefined) s.user.isPremium=false;
if(!s.achievements) s.achievements=[];
s.user.profile = Object.assign(emptyProfile(), s.user.profile||{});
if(!Array.isArray(s.user.profile.weightHistory)) s.user.profile.weightHistory=[];
if(!Array.isArray(s.user.profile.measures)) s.user.profile.measures=[];
if(!s.theme) s.theme='dark';
s.user.questPoints=s.user.questPoints||0;
s.user.streakFreezes=s.user.streakFreezes??1;
s.user.frozenDays=s.user.frozenDays||[];
s.user.freezeLastGrant=s.user.freezeLastGrant||null;
s.user.premiumFreezeGrant=s.user.premiumFreezeGrant||null;
s.quests=s.quests||{date:null,items:[],completedCount:0};
s.waterLog=s.waterLog||{date:null,ml:0};
s.waterHistory=s.waterHistory||[];
s.sleepLog=s.sleepLog||{date:null,hours:0};
s.sleepHistory=s.sleepHistory||[];
s.dailyCalories=s.dailyCalories||[];
s.user.playlists=s.user.playlists||[];
if(s.user.activePlaylist===undefined) s.user.activePlaylist=0;
if(s.user.musicPlaylist){ s.user.playlists.push({name:'Мой плейлист',url:s.user.musicPlaylist}); delete s.user.musicPlaylist; }
s.workouts=(s.workouts||[]).map(w=>{
  if(w.exercises) return w;
  const byEx={};
  (w.sets||[]).forEach(set=>{ (byEx[set.exercise]=byEx[set.exercise]||[]).push({weight:set.weight,reps:set.reps}); });
  return {name:w.name,date:w.date,duration:w.duration,exercises:Object.entries(byEx).map(([name,sets])=>({name,sets}))};
});
}
function saveState(){ localStorage.setItem('gymflow_state', JSON.stringify(state)); }
function allPrograms(){ const custom={}; state.user.customPrograms.forEach(p=>{ custom[p.id]=p; }); return Object.assign({}, PROGRAMS, custom); }

function calcTDEE(bmr,act){ return Math.round(bmr*(ACT_K[act]||1.2)); }
function calcTargetCalories(tdee,goal){ return Math.round(tdee*(goal==='lose'?.85:goal==='gain'?1.15:1)); }
function calcMacros(cal,w){ const p=1.8*w, f=.9*w; return {protein:Math.round(p),fat:Math.round(f),carbs:Math.max(0,Math.round((cal-p*4-f*9)/4))}; }
function calcWater(w){ return Math.round(w*35/100)/10; }
function calcGoalForecast(cur,target,targetCal,tdee){
  const need=target-cur, delta=targetCal-tdee;
  if(need===0) return {days:0,date:new Date()};
  if(!delta || Math.sign(need)!==Math.sign(delta)) return null;
  const days=Math.ceil(Math.abs(need)*7700/Math.abs(delta));
  return {days,date:new Date(Date.now()+days*86400000)};
}
function recommendedWeights(w,level){
  const i=level==='advanced'?2:level==='medium'?1:0;
  return RW_TABLE.map(([name,k])=>({name,weight:Math.floor(w*k[i]/2.5)*2.5,unit:name==='Подтягивания'?'доп. кг':'кг'}));
}
function inR(v,a,b){ return typeof v==='number'&&isFinite(v)&&v>=a&&v<=b; }
function pfValid(d){ return (d.gender==='male'||d.gender==='female')&&inR(d.age,14,90)&&inR(d.height,120,220)&&inR(d.weight,30,200)&&inR(d.targetWeight,30,200)&&!!ACT_K[d.activity]; }
function metrics(){
  const p=state.user.profile; if(!pfValid(p)) return null;
  const bmr=calcBMR(p.gender,p.weight,p.height,p.age);
  const tdee=calcTDEE(bmr,p.activity);
  const tc=calcTargetCalories(tdee,state.user.goal);
  return {bmi:calcBMI(p.weight,p.height),bmr,tdee,tc,macros:calcMacros(tc,p.weight),water:calcWater(p.weight)};
}

function rawStreak(){

  const dates=new Set(state.workouts.map(w=>new Date(w.date).setHours(0,0,0,0)));

  return s;
}

}

/* ---------- STREAK + FREEZE ---------- */
function streak(){
  if(!state.workouts.length) return 0;
  const frozen=new Set(state.user.frozenDays||[]);
  const has=new Set(state.workouts.map(w=>dk(w.date)));
  const ok=d=>has.has(dk(d))||frozen.has(dk(d));
  let c=new Date(); c.setHours(12,0,0,0);
  if(!ok(c)) c=new Date(c.getTime()-86400000);
  let s=0; for(let i=0;i<365&&ok(c);i++){ s++; c=new Date(c.getTime()-86400000); }
  return s;
}
function dayActive(k){ return state.workouts.some(w=>dk(w.date)===k)||(state.user.frozenDays||[]).includes(k); }
function canUseFreeze(){
  const y=dk(Date.now()-86400000), yy=dk(Date.now()-2*86400000);
  if((state.user.streakFreezes||0)<=0) return {ok:false,reason:'Нет доступных заморозок'};
  if(state.workouts.some(w=>dk(w.date)===y)) return {ok:false,reason:'Вчера ты тренировался'};
  if((state.user.frozenDays||[]).includes(y)) return {ok:false,reason:'Вчера уже заморожен'};
  if(!dayActive(yy)) return {ok:false,reason:'Серия уже прервалась'};
  return {ok:true,reason:''};
}
function useStreakFreeze(){
  const c=canUseFreeze(); if(!c.ok){ alertMsg(c.reason); return; }
  state.user.frozenDays.push(dk(Date.now()-86400000)); state.user.streakFreezes--;
  saveState(); haptic('medium'); notify('success'); trackQuestEvent('freeze_use',1);
  popup('Серия сохранена! ❄️','Вчерашний день заморожен.'); refreshUI();
}
function grantFreezeIfNeeded(){
  const u=state.user; let add=0; const wk=t=>Math.floor(new Date(t).getTime()/604800000);
  if(u.streakFreezes===0&&streak()>=7&&(!u.freezeLastGrant||wk(u.freezeLastGrant)!==wk(todayStr()))){ u.streakFreezes++; u.freezeLastGrant=todayStr(); add+=1; }

  if(add){ saveState(); popup('🎁 Ты получил заморозку серии!','❄️ +'+add); }
}

function waterStep(liters){

/* ---------- CALORIES ---------- */
function estimateWorkoutCalories(){
  const s=session; if(!s) return 0;
  const bw=(state.user.profile&&state.user.profile.weight)||75;
  const sets=s.exercises.reduce((a,e)=>a+e.sets.length,0);
  const minutes=Math.max(15,Math.round(sets*3.5+5));
  return Math.round(6*3.5*bw/200*minutes);
}

}

function getOverloadHint(name){
  const info=lastWorkoutWith(name);
  if(!info||!info.set) return null;
  const key='ov_'+name+'_'+info.date;

  markHintShown(key);
  if(info.set.reps>=12) return `В прошлый раз: ${info.set.weight} кг × ${info.set.reps}. Попробуй ${info.set.weight+2.5} кг сегодня!`;
  if(info.set.reps<8) return `В прошлый раз было тяжело (${info.set.reps} повт. на ${info.set.weight} кг). Попробуй тот же вес.`;

}
function maybeSuggestProgress(ex){
  if(ex.sets.length<3) return;
  const w=ex.sets[0].weight;
  const allSame=ex.sets.every(s=>s.weight===w&&s.reps>=12);
  if(!allSame) return;
  const key='progress_'+ex.name+'_'+new Date().toDateString();
  if(hintStore()[key]) return;
  markHintShown(key);
  popup('Ты готов к прогрессу! 📈',`Поднять вес в «${ex.name}» на 2.5 кг в следующий раз?`);
}

/* ---------- REST TIMER ---------- */
let restInterval=null;
function showRestTimer(onDone){
  const bar=$('restBar');
  let remaining=state.user.restTime;
  let total=remaining;
  function render(){
    bar.innerHTML=`<div class="rest-num">${remaining}с</div><div class="rest-track"><div class="rest-fill" style="width:${remaining/total*100}%"></div></div><div class="rest-dur">${[60,90,120].map(d=>`<div class="rest-dur-btn tappable ${state.user.restTime===d?'sel':''}" data-d="${d}">${d}с</div>`).join('')}</div><div class="btn-row"><button class="btn-secondary" id="restSkip">Пропустить</button><button class="btn-secondary" id="restPlus">+30 сек</button></div>`;
    bar.querySelectorAll('[data-d]').forEach(b=>{ b.addEventListener('click',()=>{ haptic('light'); state.user.restTime=parseInt(b.dataset.d); saveState(); remaining=state.user.restTime; total=remaining; render(); }); });
    $('restSkip').addEventListener('click',finish);
    $('restPlus').addEventListener('click',()=>{ haptic('light'); remaining+=30; render(); });
  }
  function finish(){ clearInterval(restInterval); bar.classList.remove('show'); onDone(); }
  render(); bar.classList.add('show');
  restInterval=setInterval(()=>{ remaining--; if(remaining<=0){ notify('success'); trackQuestEvent('rest_timer_use',1); finish(); return; } const track=bar.querySelector('.rest-fill'), num=bar.querySelector('.rest-num'); if(track) track.style.width=(remaining/total*100)+'%'; if(num) num.textContent=remaining+'с'; },1000);
}
function finishWorkout(){
  const totalSetsCount=session.exercises.reduce((a,e)=>a+e.sets.length,0);
  const duration=Math.max(15,Math.round(totalSetsCount*3.5+5));
  state.workouts.push({name:session.day.label,date:new Date().toISOString(),duration,exercises:session.exercises.filter(e=>e.sets.length)});
  state.currentDayIndex++; state.points+=totalSetsCount*10;
  saveDailyCalories(); saveState();
  $('workoutScreen').classList.remove('show');
  session=null;
  notify('success'); haptic('medium'); setTimeout(()=>haptic('medium'),150);
  afterWorkout(); checkAchievements(); renderHome();
}

function dailyAgg(){ const map={}; state.workouts.forEach(w=>{ const key=new Date(w.date).toDateString(); if(!map[key]) map[key]={exCount:0,volume:0}; map[key].exCount+=w.exercises.length; w.exercises.forEach(e=>e.sets.forEach(s=>map[key].volume+=(s.weight||0)*s.reps)); }); return map; }
function heatColor(c){ if(!c) return 'var(--border)'; if(c<=2) return 'rgba(255,77,141,0.22)'; if(c<=4) return 'rgba(255,77,141,0.55)'; return 'var(--accent)'; }
function renderHeatmap(){
  const agg=dailyAgg(); const days=168; const today=new Date(); today.setHours(0,0,0,0); const cells=[];
  for(let i=days-1;i>=0;i--){ const d=new Date(today.getTime()-i*86400000); const key=d.toDateString(); const data=agg[key]||{exCount:0,volume:0}; cells.push(`<div class="hm-cell tappable" style="background:${heatColor(data.exCount)}" data-date="${d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}" data-count="${data.exCount}" data-vol="${Math.round(data.volume)}"></div>`); }
  return `<div class="heatmap-scroll"><div class="heatmap-grid">${cells.join('')}</div></div><div id="hmTooltip" class="sub">Нажми на день, чтобы увидеть детали</div><div class="legend">меньше<div class="hm-cell" style="background:var(--border)"></div><div class="hm-cell" style="background:rgba(255,77,141,0.22)"></div><div class="hm-cell" style="background:rgba(255,77,141,0.55)"></div><div class="hm-cell" style="background:var(--accent)"></div>больше</div>`;
}

    const tips=data.tips||[]; trackQuestEvent('ai_use',1);
    box.innerHTML=tips.length?tips.map(t=>`<div class="ai-tip">${icon('sparkle')}<div>${escH(t)}</div></div>`).join(''):`<div class="sub">Недостаточно данных для рекомендаций.</div>`;

}

/* ---------- ANALYTICS FOR AI + LOCAL TIPS ---------- */
const AI_BRIEF='Ты — тренер-аналитик приложения GymFlow. Отвечай по-русски и верни JSON {"tips":[...]} из 3–5 советов. Каждый совет обязан опираться на конкретные цифры из поля analytics (названия упражнений, веса, проценты, даты), содержать вывод и одно конкретное действие на ближайшие 1–2 тренировки. Учитывай цель пользователя (goal) и профиль. Не пиши общих фраз вроде «пей больше воды» или «высыпайся», если они не следуют из данных. Не давай медицинских рекомендаций. Если данных мало — прямо скажи, какие данные нужно набрать.';
function buildAnalytics(){
  const DAY=86400000, now=Date.now(), ws=[...state.workouts].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const age=w=>now-new Date(w.date).getTime();
  const a={total:ws.length,goal:state.user.goal||null,streak:streak()};
  a.last7=ws.filter(w=>age(w)<7*DAY).length;
  a.last28=ws.filter(w=>age(w)<28*DAY).length;
  a.perWeek=+(a.last28/4).toFixed(1);
  a.daysSinceLast=ws.length?Math.floor(age(ws[ws.length-1])/DAY):null;
  a.weeklyVolume=[3,2,1,0].map(i=>{let v=0;ws.forEach(w=>{const g=age(w);if(g>=i*7*DAY&&g<(i+1)*7*DAY)w.exercises.forEach(e=>e.sets.forEach(s=>v+=(s.weight||0)*s.reps));});return Math.round(v);});
  const ms={};let tot=0;
  ws.filter(w=>age(w)<28*DAY).forEach(w=>w.exercises.forEach(e=>{const m=(EXERCISES[e.name]||{}).muscle;if(!m)return;ms[m]=(ms[m]||0)+e.sets.length;tot+=e.sets.length;}));
  a.muscleShare={};Object.keys(ms).forEach(m=>a.muscleShare[m]=Math.round(ms[m]/tot*100));
  a.missingMuscles=tot?['Грудь','Спина','Ноги','Плечи','Руки','Пресс'].filter(m=>!ms[m]):[];
  a.exercises=exerciseProgress().filter(([,d])=>d.max>0&&d.sessions.length>=2).map(([name,d])=>{
    const s=d.sessions.slice().sort((x,y)=>new Date(x.date)-new Date(y.date));
    const first=s[0].max,last=s[s.length-1].max,recent=s.slice(-3).map(x=>x.max);
    let e1=0;ws.forEach(w=>w.exercises.forEach(e=>{if(e.name===name)e.sets.forEach(x=>{const v=(x.weight||0)*(1+x.reps/30);if(v>e1)e1=v;});}));
    return {name,sessions:s.length,first,last,best:d.max,recent,change:last-first,stalled:recent.length===3&&recent.every(x=>x===recent[0]),e1rm:Math.round(e1)};
  }).sort((x,y)=>y.sessions-x.sessions).slice(0,8);
  return a;
}
function generateLocalInsights(max=4){
  if(!state.workouts.length) return ['Проведи первую тренировку — после неё здесь появятся персональные советы по твоему прогрессу.'];
  const a=buildAnalytics(), tips=[];
  if(a.daysSinceLast>=7) tips.push(`Ты не тренировался ${a.daysSinceLast} дн. Вернись с лёгкой тренировки: рабочие веса на 10–15% ниже обычных. Первые две недели важнее вернуть регулярность, чем побить рекорды.`);
  else if(a.streak>=6) tips.push(`Ты тренируешься ${a.streak} дней подряд. Запланируй день отдыха: мышцы растут в восстановлении, а без пауз прогресс в весах обычно замедляется.`);
  const st=a.exercises.find(e=>e.stalled);
  if(st) tips.push(`«${st.name}» стоит на ${st.last} кг уже три тренировки подряд. Добавь по 1–2 повтора в каждом подходе, а когда упрёшься в верх диапазона — прибавь 2,5 кг.`);
  const up=a.exercises.filter(e=>e.change>0).sort((x,y)=>y.change-x.change)[0];
  if(up) tips.push(`Лучший прогресс — «${up.name}»: ${up.first} → ${up.last} кг (+${up.change} кг за ${up.sessions} тренировок). Расчётный максимум на один повтор — около ${up.e1rm} кг.`);
  const mm=Object.entries(a.muscleShare).sort((x,y)=>y[1]-x[1]);
  if(mm.length>=2&&a.missingMuscles.length) tips.push(`За последние 4 недели не было нагрузки на: ${a.missingMuscles.join(', ').toLowerCase()}. При этом «${mm[0][0].toLowerCase()}» — ${mm[0][1]}% всех подходов. Добавь 2–3 упражнения на отстающие группы.`);
  else if(mm.length>=2&&mm[0][1]>=45) tips.push(`«${mm[0][0]}» занимает ${mm[0][1]}% подходов за месяц — это перекос. Перенеси 2–3 подхода на «${mm[mm.length-1][0].toLowerCase()}» (${mm[mm.length-1][1]}%).`);
  if(a.perWeek<2&&a.last28>0) tips.push(`Частота за последние 4 недели — ${String(a.perWeek).replace('.',',')} в неделю. Для стабильного роста нужно 3–4: закрепи три фиксированных дня в календаре.`);
  const w=a.weeklyVolume;
  if(w[2]>0&&w[3]>0){ const d=Math.round((w[3]-w[2])/w[2]*100);
    if(d<=-25) tips.push(`Объём за последнюю неделю упал на ${Math.abs(d)}% (${w[3]} против ${w[2]} кг). Если это не плановая разгрузка — верни привычное число подходов.`);
    else if(d>=40) tips.push(`Объём за неделю вырос на ${d}% (${w[3]} против ${w[2]} кг). Это быстрый скачок: следи за сном и самочувствием, чтобы не перегореть.`); }
  return (tips.length?tips:['Данных пока мало: сделай ещё 2–3 тренировки с записью весов и повторов — тогда советы станут точнее.']).slice(0,max);
}

let builder=null;

function renderBuilder(){
  openSheet(`<div class="sheet-handle"></div><div class="h1" style="margin-bottom:16px;">${state.user.customPrograms.find(p=>p.id===builder.id)?'Редактирование':'Новая программа'}</div>

  <div class="freq-row" id="bFreq">${[1,2,3,4,5,6,7].map(n=>`<div class="freq-btn tappable ${builder.days.length===n?'sel':''}" data-n="${n}">${n}</div>`).join('')}</div>

function renderBuilderDays(){
  const box=$('bDays');
  box.innerHTML=builder.days.map((d,i)=>`<div class="day-block"><input value="${escH(d.label)}" data-dayname="${i}" placeholder="Например, Пуш-день" style="margin-bottom:10px;font-weight:700;"><div id="dEx${i}">${d.ex.map((name,j)=>`<div class="picker-item"><div style="display:flex;flex-direction:column;gap:0;">${j>0?`<button class="tappable" data-mvup="${i}:${j}" style="color:var(--text-tertiary);font-size:12px;line-height:1;padding:3px 6px;">▲</button>`:'<span style="height:18px;"></span>'}<button class="tappable" data-mvdn="${i}:${j}" style="color:var(--text-tertiary);font-size:12px;line-height:1;padding:3px 6px;">▼</button></div><div class="ex-icon" style="width:32px;height:32px;">${exIcon((EXERCISES[name]||{icon:'ex-bench-press'}).icon)}</div><div style="flex:1;font-size:13px;">${escH(name)}</div><div class="tappable" data-rmex="${i}:${j}" style="color:var(--text-tertiary);font-size:18px;">×</div></div>`).join('')}</div><button class="btn-ghost tappable" data-addex="${i}">+ Добавить упражнение</button></div>`).join('');
  box.querySelectorAll('[data-dayname]').forEach(inp=>{ inp.addEventListener('input',e=>{ builder.days[inp.dataset.dayname].label=e.target.value; }); });
  box.querySelectorAll('[data-addex]').forEach(b=>{ b.addEventListener('click',()=>{ haptic('light'); openExercisePicker(parseInt(b.dataset.addex)); }); });
  box.querySelectorAll('[data-rmex]').forEach(b=>{ b.addEventListener('click',()=>{ haptic('light'); const [i,j]=b.dataset.rmex.split(':').map(Number); builder.days[i].ex.splice(j,1); renderBuilderDays(); }); });
  box.querySelectorAll('[data-mvup]').forEach(b=>b.addEventListener('click',()=>{ const [i,j]=b.dataset.mvup.split(':').map(Number); if(j<=0) return; const arr=builder.days[i].ex; [arr[j-1],arr[j]]=[arr[j],arr[j-1]]; haptic('light'); renderBuilderDays(); }));
  box.querySelectorAll('[data-mvdn]').forEach(b=>b.addEventListener('click',()=>{ const [i,j]=b.dataset.mvdn.split(':').map(Number); const arr=builder.days[i].ex; if(j>=arr.length-1) return; [arr[j+1],arr[j]]=[arr[j],arr[j+1]]; haptic('light'); renderBuilderDays(); }));
}
function openExercisePicker(dayIndex){
  function list(filter){ return Object.entries(EXERCISES).filter(([name,e])=>!filter||name.toLowerCase().includes(filter.toLowerCase())||e.muscle.toLowerCase().includes(filter.toLowerCase())).map(([name,e])=>`<div class="picker-item tappable" data-pick="${escH(name)}"><div class="ex-icon" style="width:32px;height:32px;">${exIcon(e.icon)}</div><div style="flex:1;"><div class="ex-name">${escH(name)}</div><div class="ex-muscle">${escH(e.muscle)}</div></div></div>`).join(''); }
  openSheet(`<div class="sheet-handle"></div><div class="h2">Выбери упражнение</div><input id="pSearch" placeholder="Поиск по названию или группе мышц" style="margin-bottom:12px;"><div id="pList" style="max-height:50vh;overflow-y:auto;">${list('')}</div><button class="btn-secondary" id="pBack" style="width:100%;margin-top:12px;">Назад</button>`);
  $('pSearch').addEventListener('input',e=>{ $('pList').innerHTML=list(e.target.value); bindPick(); });
  function bindPick(){ document.querySelectorAll('[data-pick]').forEach(el=>{ el.addEventListener('click',()=>{ haptic('light'); builder.days[dayIndex].ex.push(el.dataset.pick); trackQuestEvent('custom_program_add',1); renderBuilder(); }); }); }
  bindPick();
  $('pBack').addEventListener('click',()=>{ haptic('light'); renderBuilder(); });
}

function offerPremium(msg){
  haptic('light');
  if(tg&&tg.showPopup&&(!tg.isVersionAtLeast||tg.isVersionAtLeast('6.2'))){ tg.showPopup({title:'GymFlow Premium',message:msg,buttons:[{id:'buy',type:'default',text:'Оформить'},{type:'cancel'}]},id=>{ if(id==='buy') openPremium(); }); }
  else if(confirm(msg+'\n\nОткрыть Premium?')) openPremium();
}
function requirePremium(name){ if(isPremium()) return true; offerPremium('«'+name+'» доступно в Premium за 1 ⭐.'); return false; }
function onPremiumActivated(){ if($('profileScreen').classList.contains('show')) renderProfile(); if(!$('screen-programs').classList.contains('hidden')) renderPrograms(); }
function lockWrap(inner){ const p=isPremium(); return `<div class="lockbox ${p?'':'locked'}"><div class="lk-content">${inner}</div>${p?'':'<div class="lk-over"><button class="btn-primary" data-unlock>🔒 Разблокировать за 1 ⭐</button></div>'}</div>`; }
function aiUsageGet(){ let u=null; try{ u=JSON.parse(localStorage.getItem('gymflow_ai_usage')); }catch(e){} if(!u||u.date!==todayStr()) u={date:todayStr(),count:0}; return u; }
function checkAILimit(){ return isPremium()||aiUsageGet().count<3; }
function useAIRequest(){ if(isPremium()) return true; if(!checkAILimit()){ offerPremium('Дневной лимит AI-запросов исчерпан (3/3). Оформите Premium за 1 ⭐.'); return false; } return true; }
function aiLeftText(){ return isPremium()?'Premium: безлимит':`До 3 бесплатных запросов в день`; }
function best1RM(name){ let m=0; state.workouts.forEach(w=>w.exercises.forEach(e=>{ if(e.name===name) e.sets.forEach(s=>{ const r=(s.weight||0)*(1+s.reps/30); if(r>m) m=r; }); })); return Math.round(m); }
function rm1HTML(name){ return isPremium()?`<div class="sub" style="margin:2px 0 0;font-size:12px;">1RM ≈ ${best1RM(name)} кг</div>`:`<div class="sub tappable" data-rm1 style="margin:2px 0 0;font-size:12px;">🔒 1RM</div>`; }
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); try{ localStorage.setItem('gymflow_theme',t); }catch(e){} state.theme=t; saveState(); }
function initTheme(){ let t='dark'; try{ t=localStorage.getItem('gymflow_theme')||state.theme||'dark'; }catch(e){} if(t==='light'&&!isPremium()) t='dark'; applyTheme(t); }

/* ---------- PROFILE SCREEN ---------- */
function years(a){ const d=a%10,h=a%100; return a+' '+(d===1&&h!==11?'год':(d>=2&&d<=4&&(h<12||h>14))?'года':'лет'); }
function weightSpark(h){
  h=h.slice(-30); if(h.length<2) return '<div class="sub">Добавь ещё одно взвешивание — построим график.</div>';
  const ws=h.map(x=>x.weight), mx=Math.max(...ws), mn=Math.min(...ws);
  const pts=ws.map((w,i)=>(i/(ws.length-1)*280).toFixed(1)+','+(mx===mn?25:(46-((w-mn)/(mx-mn))*42).toFixed(1))).join(' ');
  return `<svg viewBox="0 0 280 50" width="100%" height="50" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function themeCard(){
  const t=document.documentElement.getAttribute('data-theme')||'dark';
  return `<div class="card"><div class="h2">Оформление <span class="pbadge">⭐ Premium</span></div><div class="seg"><button class="seg-b ${t==='dark'?'sel':''}" data-th="dark">Тёмная</button><button class="seg-b ${t==='light'?'sel':''}" data-th="light">${isPremium()?'':'🔒 '}Светлая</button></div></div>`;
}
function backupCard(){
  const size=Math.round((localStorage.getItem('gymflow_state')||'').length/1024);
  return `<div class="card"><div class="h2">💾 Резервная копия</div><div class="sub" style="margin:0 0 12px;">Размер данных: ~${size} КБ. Экспорт — в JSON-файл, импорт заменит текущее состояние.</div><div class="btn-row"><button class="btn-secondary" data-exportjson>Экспорт</button><button class="btn-secondary" data-importjson>Импорт</button></div></div>`;
}
function exportJSON(){
  try{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='gymflow_backup_'+todayStr()+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},1000);
    notify('success');
  }catch(e){ alertMsg('Не удалось сохранить: '+e.message); }
}
function importJSON(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d||typeof d!=='object'||!d.user) throw new Error('Это не файл GymFlow');
        if(!confirm('Заменить все текущие данные импортированными? Действие необратимо.')) return;
        migrate(d);
        state=d; saveState();
        popup('Импорт завершён ✅','Сейчас приложение перезагрузится.');
        setTimeout(()=>location.reload(),1200);
      }catch(e){ alertMsg('Не удалось прочитать файл: '+e.message); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function openProfile(){ trackQuestEvent('profile_view',1); renderProfile(); $('profileScreen').classList.add('show'); }
function renderProfile(){
  const scr=$('profileScreen'), p=state.user.profile, m=metrics(); let body;

    const avatarHtml=userPhotoUrl()?`<div class="avatar" style="margin:0;background-image:url('${userPhotoUrl()}');background-size:cover;background-position:center;color:transparent;">${state.user.name[0].toUpperCase()}</div>`:`<div class="avatar" style="margin:0;">${state.user.name[0].toUpperCase()}</div>`;

      <div style="display:flex;justify-content:space-between;align-items:flex-end;"><div><div class="label">Сейчас</div><div class="stat-num" style="font-size:34px;">${p.weight}<span class="sub"> кг</span></div></div><div style="text-align:right;"><div class="label">Цель</div><div class="stat-num" style="font-size:34px;color:var(--accent);">${tw}<span class="sub"> кг</span></div></div></div>
      ${reached?'<div class="hint-card" style="margin:14px 0 0;text-align:center;font-weight:700;">🎯 Цель достигнута!</div>':`<div class="rest-track" style="margin:14px 0 0;"><div class="rest-fill" style="width:${Math.round(pr*100)}%"></div></div>`}
      <button class="btn-secondary" data-share="profile" style="width:100%;margin-top:12px;">📤 Поделиться</button>
    </div>
    <div class="card"><div class="h2">Мои показатели</div>
      <div class="ring-row" style="margin-bottom:10px;">
        <svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="${R}" stroke="var(--border)" stroke-width="6" fill="none"/><circle cx="40" cy="40" r="${R}" stroke="${bc.c}" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 40 40)"/><text x="40" y="45" text-anchor="middle" fill="var(--text)" font-size="16" font-weight="800">${m.bmi}</text></svg>
        <div><div class="label">ИМТ</div><div style="font-weight:800;font-size:18px;color:${bc.c};">${bc.t}</div></div>
      </div>
      <div class="m-row"><span>BMR (базовый обмен)</span><b>${m.bmr} ккал/день</b></div>

function generateDailyQuests(){
  if(state.quests.date===todayStr()&&state.quests.items.length) return;
  const pool=[...QUEST_POOL];
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  state.quests={date:todayStr(),items:pool.slice(0,3).map(q=>({id:q.id,icon:q.icon,title:q.title,desc:q.desc,reward:q.reward,target:q.target,progress:0,done:false,claimed:false})),completedCount:0};

  const ms=state.user.profile.measures||[];
  const rows=MS.map(([k,n])=>{ const vals=ms.filter(m=>m[k]).map(m=>m[k]); if(!vals.length) return ''; const cur=vals[vals.length-1], prev=vals.length>1?vals[vals.length-2]:null; let d=''; if(prev!=null&&cur!==prev){ const diff=Math.round((cur-prev)*10)/10; d=`<span class="measure-delta">${diff>0?'▲':'▼'} ${Math.abs(diff)}</span>`; } return `<div class="measure-row"><span>${n}</span><span style="display:flex;gap:10px;align-items:center;">${miniSpark(vals)}<b>${cur} см</b>${d}</span></div>`; }).join('');
  return `<div class="card"><div class="h2">📏 Замеры тела</div>${rows||'<div class="sub" style="margin:0 0 12px;">Пока нет замеров</div>'}<div class="grid2" style="margin:12px 0;gap:8px;">${MS.map(([k,n])=>`<div class="field"><label>${n}, см</label><input id="m_${k}" type="number" inputmode="decimal" placeholder="—"></div>`).join('')}</div><button class="btn-primary" data-msr style="width:100%;">Добавить замер сегодня</button></div>`;
}
function saveMeasure(){ const p=state.user.profile, vals={}; MS.forEach(([k])=>{ const x=parseFloat($('m_'+k).value); if(isFinite(x)&&x>0&&x<300) vals[k]=x; }); if(!Object.keys(vals).length){ alertMsg('Заполни хотя бы одно поле'); return; } p.measures=p.measures||[]; const t=todayStr(), e=p.measures.find(m=>m.date===t); if(e) Object.assign(e,vals); else p.measures.push(Object.assign({date:t},vals)); saveState(); haptic('medium'); renderProfile(); }

/* ---------- REMINDERS ---------- */
const DAYS=[['mon','Пн'],['tue','Вт'],['wed','Ср'],['thu','Чт'],['fri','Пт'],['sat','Сб'],['sun','Вс']];
function rem(){ return Object.assign({enabled:false,time:'18:00',days:['mon','wed','fri']},state.user.reminders||{}); }
function remindersCard(){ const r=rem(); return `<div class="card"><div class="h2">🔔 Напоминания</div><label style="display:flex;align-items:center;gap:10px;margin-bottom:12px;"><input type="checkbox" id="remOn" ${r.enabled?'checked':''} style="width:auto;">Включить напоминания</label><div class="field" style="margin-bottom:12px;"><label>Время</label><input type="time" id="remTime" value="${r.time}"></div><div class="pills" style="margin-bottom:12px;">${DAYS.map(([k,t])=>`<label class="pill" style="display:flex;gap:6px;align-items:center;"><input type="checkbox" class="remDay" value="${k}" ${r.days.includes(k)?'checked':''} style="width:auto;">${t}</label>`).join('')}</div><button class="btn-primary" data-rsave style="width:100%;">Сохранить</button><div class="sub" style="font-size:12px;margin-top:8px;">Настройки сохраняются на устройстве.</div></div>`; }
function saveReminders(){ state.user.reminders={enabled:$('remOn').checked,time:$('remTime').value||'18:00',days:[...document.querySelectorAll('.remDay:checked')].map(x=>x.value)}; saveState(); haptic('medium'); alertMsg('Напоминания сохранены 🔔'); }

/* ---------- WRAPPED ---------- */
let wrapOff=0;
const WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function wrappedStats(off=0){
  const now=new Date(), a=new Date(now.getFullYear(),now.getMonth()-off,1), b=new Date(now.getFullYear(),now.getMonth()-off+1,1);
  const ws=state.workouts.filter(w=>{ const d=new Date(w.date); return d>=a&&d<b; });
  const days={}, ex={}, mx={}; let vol=0;
  ws.forEach(w=>{ const wd=new Date(w.date).getDay(); days[wd]=(days[wd]||0)+1; w.exercises.forEach(e=>{ ex[e.name]=(ex[e.name]||0)+1; e.sets.forEach(s=>{ vol+=(s.weight||0)*s.reps; if((s.weight||0)>(mx[e.name]||0)) mx[e.name]=s.weight; }); }); });
  const top=o=>Object.entries(o).sort((x,y)=>y[1]-x[1])[0];
  const bd=top(days), fv=top(ex); let rec=null;
  Object.entries(mx).forEach(([n,m])=>{ let before=0; state.workouts.forEach(w=>{ if(new Date(w.date)<a) w.exercises.forEach(e=>{ if(e.name===n) e.sets.forEach(s=>{ if((s.weight||0)>before) before=s.weight; }); }); }); const delta=before>0?m-before:0; if(!rec||delta>rec.delta||(rec.delta===0&&delta===0&&m>rec.max)) rec={name:n,delta,max:m}; });
  return {count:ws.length,volume:Math.round(vol),bestDay:bd?WD[bd[0]]:'—',bestDayCount:bd?bd[1]:0,fav:fv?fv[0]:'—',favCount:fv?fv[1]:0,rec,month:a.toLocaleDateString('ru-RU',{month:'long'})};
}
function openWrapped(off=0){ wrapOff=off; const s=wrappedStats(off); const sl=(e,big,cap)=>`<div class="slide"><div style="font-size:56px;">${e}</div><div class="stat-num" style="font-size:44px;margin:12px 0;">${big}</div><div class="sub">${cap}</div></div>`; $('wrapScreen').innerHTML=`<div class="pd-top"><div class="pd-back tappable" id="wrBack">← Назад</div><div class="h1" style="margin-bottom:16px;text-transform:capitalize;">${s.month}: итоги</div></div><div class="slides">${sl('🏋️',s.count,'тренировок за месяц')}${sl('📊',s.volume+' кг','общий объём')}${sl('📅',s.bestDay,s.bestDayCount?'лучший день: '+plural(s.bestDayCount,['тренировка','тренировки','тренировок']):'пока нет данных')}${sl('❤️',s.fav,s.favCount?'любимое упражнение · '+s.favCount+' раз':'пока нет данных')}${sl('🚀',s.rec?s.rec.name:'—',s.rec?(s.rec.delta>0?'новый рекорд: +'+s.rec.delta+' кг (до '+s.rec.max+' кг)':'твой максимум: '+s.rec.max+' кг'):'пока нет данных')}</div><div class="pd-body" style="margin-top:16px;"><div class="sub" style="text-align:center;margin-bottom:12px;">Листай в сторону →</div><button class="btn-primary" data-wshare style="width:100%;">📤 Поделиться</button></div>`; $('wrapScreen').classList.add('show'); $('wrBack').addEventListener('click',()=>{ haptic('light'); $('wrapScreen').classList.remove('show'); }); }
function wrappedCheck(){ try{ const now=new Date(), key=now.getFullYear()+'-'+now.getMonth(); if(state.wrappedShown===key) return; state.wrappedShown=key; saveState(); const s=wrappedStats(1); if(!s.count) return; popupBtns('Твой итог за '+s.month+' готов!','Посмотреть?',[{id:'go',type:'default',text:'Смотреть'},{id:'later',type:'default',text:'Позже'}],id=>{ if(id==='go') openWrapped(1); }); }catch(e){} }

/* ---------- DELEGATED ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-share],[data-freeze],[data-buypts],[data-buystar],[data-quests],[data-calendar],[data-warmup],[data-music],[data-tech],[data-water],[data-sleep],[data-calnav],[data-calday],[data-mplay],[data-mopen],[data-madd],[data-msearch],[data-plact],[data-pldel],[data-msr],[data-rsave],[data-wrapped],[data-wshare],[data-exportjson],[data-importjson]');
  if(!t) return;
  haptic('light');
  const d=t.dataset;
  if('quests' in d) openQuests();
  else if('calendar' in d) openCalendar();
  else if('warmup' in d) openWarmup();
  else if('music' in d) openMusic();
  else if('mplay' in d) openMusic();
  else if('mopen' in d) openMusic();
  else if('madd' in d) addPlaylist();
  else if('msearch' in d) openLinkSafe('https://music.yandex.ru/search?text='+encodeURIComponent(d.msearch));
  else if('plact' in d){ state.user.activePlaylist=parseInt(d.plact); saveState(); renderProfile(); }
  else if('pldel' in d){ const i=parseInt(d.pldel); state.user.playlists.splice(i,1); if(state.user.activePlaylist>=state.user.playlists.length) state.user.activePlaylist=Math.max(0,state.user.playlists.length-1); saveState(); renderProfile(); }
  else if('tech' in d) openTech(d.tech);
  else if('water' in d) waterStep(parseFloat(d.water));
  else if('sleep' in d) setSleep(parseInt(d.sleep,10));
  else if('calnav' in d){ calOff=Math.min(0,calOff+parseInt(d.calnav,10)); renderCalendar(); }
  else if('calday' in d) openDay(d.calday);
  else if('msr' in d) saveMeasure();
  else if('rsave' in d) saveReminders();
  else if('wrapped' in d) openWrapped(0);
  else if('wshare' in d) openShareSheet('streak');
  else if('exportjson' in d) exportJSON();
  else if('importjson' in d) importJSON();
  else if('freeze' in d) useStreakFreeze();
  else if('share' in d){ if(d.share==='streak') shareStreakCard(); else shareProfileCard(); }
  else if('buypts' in d){ if((state.user.questPoints||0)<50) return; state.user.questPoints-=50; state.user.streakFreezes++; saveState(); popup('Заморозка куплена! ❄️','Теперь у тебя '+plural(state.user.streakFreezes,['заморозка','заморозки','заморозок'])); refreshUI(); }
  else if('buystar' in d) buyWithStars(5,'Заморозка серии','1 заморозка для сохранения серии','streak_freeze',()=>{ syncPremiumStatus(); notify('success'); popup('Заморозка куплена! ❄️','Спасибо за поддержку!'); });
});

/* ---------- SHEET BEHAVIOUR ---------- */
(function(){ const sh=$('sheet'), ov=$('overlay'); function ensureClose(){ if(sh.querySelector('.sheet-close')) return; const b=document.createElement('button'); b.className='sheet-close'; b.textContent='✕'; b.setAttribute('aria-label','Закрыть'); b.addEventListener('click',()=>{ haptic('light'); closeSheet(); }); sh.insertBefore(b,sh.firstChild); } new MutationObserver(ensureClose).observe(sh,{childList:true}); new MutationObserver(()=>{ if(sh.classList.contains('show')) ensureClose(); }).observe(sh,{attributes:true,attributeFilter:['class']}); ov.addEventListener('click',()=>{ haptic('light'); closeSheet(); }); let y0=null; sh.addEventListener('touchstart',e=>{ y0=(sh.scrollTop<=0&&!e.target.closest('#pList'))?e.touches[0].clientY:null; },{passive:true}); sh.addEventListener('touchmove',e=>{ if(y0==null) return; const dy=e.touches[0].clientY-y0; if(dy>0){ sh.style.transition='none'; sh.style.transform='translateY('+dy+'px)'; } },{passive:true}); sh.addEventListener('touchend',e=>{ if(y0==null) return; const dy=e.changedTouches[0].clientY-y0; y0=null; sh.style.transition=''; sh.style.transform=''; if(dy>100){ haptic('light'); closeSheet(); } }); })();

/* ---------- CHECK ACHIEVEMENTS ---------- */
function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(state.achievements.find(x=>x.id===a.id)) return;
    if(a.check(state)){
      state.achievements.push({id:a.id,unlockedAt:new Date().toISOString()});
      trackQuestEvent('new_achievement',1);
      notify('success');
      popup(a.emoji+' Достижение разблокировано!',a.name);
    }
  });
  saveState();
}

/* ---------- STATS TABS ---------- */
let statsTab='ov';
function tabifyStats(){
  const el=$('screen-stats'), kids=[...el.children], head=kids.shift(), g={ov:[],rec:[],more:[]};
  kids.forEach(k=>{ const h=(k.querySelector('.h2')||{}).textContent||''; g[/Поделиться|Итоги|Экспорт|Premium/.test(h)?'more':/Прогресс по|рекорд|Достижен/.test(h)?'rec':'ov'].push(k); });
  el.innerHTML=''; el.appendChild(head);
  const bar=document.createElement('div'); bar.className='stabs'; const P={}, T=[['ov','Обзор'],['rec','Рекорды'],['more','Ещё']];
  T.forEach(([k,n])=>{ const b=document.createElement('button'); b.textContent=n; b.className=k===statsTab?'on':''; b.onclick=()=>{ haptic('light'); statsTab=k; bar.querySelectorAll('button').forEach((x,i)=>x.classList.toggle('on',T[i][0]===k)); Object.entries(P).forEach(([pk,pe])=>pe.classList.toggle('on',pk===k)); }; bar.appendChild(b);
    const d=document.createElement('div'); d.className='sp'+(k===statsTab?' on':''); g[k].forEach(c=>d.appendChild(c)); P[k]=d; });
  el.appendChild(bar); Object.values(P).forEach(d=>el.appendChild(d));
}
/* ---------- NAV ---------- */
function switchTab(tab){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.querySelectorAll('.dock-btn').forEach(b=>b.classList.remove('active'));
  $('screen-'+tab).classList.remove('hidden');
  document.querySelector(`.dock-btn[data-tab="${tab}"]`).classList.add('active');
  try{
    if(tab==='home'){ renderHome(); if(tg&&tg.BackButton) tg.BackButton.hide(); }
    if(tab==='stats'){ renderStats(); tabifyStats(); if(tg&&tg.BackButton) tg.BackButton.show(); }
    if(tab==='programs'){ renderPrograms(); if(tg&&tg.BackButton) tg.BackButton.show(); }
  }catch(err){
    console.error('[GymFlow] render failed',err);
    $('screen-'+tab).innerHTML=`<div class="card" style="margin-top:40px;text-align:center;"><div class="h2">Что-то пошло не так</div><div class="sub" style="margin:8px 0 14px;">Данные сохранены. Перезагрузи приложение.</div><button class="btn-primary" id="recoverBtn" style="width:100%;">Перезагрузить</button></div>`;
    const rb=$('recoverBtn'); if(rb) rb.addEventListener('click',()=>location.reload());
  }
}
document.querySelectorAll('.dock-btn').forEach(b=>{ b.addEventListener('click',()=>{ haptic('light'); switchTab(b.dataset.tab); }); });
if(tg&&tg.BackButton){ tg.BackButton.onClick(()=>{ haptic('light'); switchTab('home'); }); }

/* ---------- BOOT ---------- */
function boot(){
  initTheme();
  if(state.onboardingDone){
    generateDailyQuests();
    grantFreezeIfNeeded();
    syncPremiumStatus();
    setTimeout(wrappedCheck,2500);
  }
  if(!state.onboardingDone){
    $('onboarding').classList.remove('hidden');
    $('main').classList.add('hidden');
    obStep=0; obChoice={goal:null,level:null,program:null}; pfDraft=emptyProfile();
    renderOnboarding();
  } else {
    $('onboarding').classList.add('hidden');
    $('main').classList.remove('hidden');
    switchTab('home');
  }
}
boot();
</script>
<script>
/* ---------- 3D HERO + TILT + COUNTERS ---------- */
(function(){
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let tc=null;
function tilt(e){const r=tc.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;tc.style.transform='perspective(700px) rotateX('+(-y*9)+'deg) rotateY('+(x*9)+'deg) scale(.985)'}
function rs(){if(tc){tc.style.transform='';tc=null}}
if(!reduce){
addEventListener('pointerdown',e=>{const c=e.target.closest('.card');if(!c)return;tc=c;tilt(e)},{passive:true});
addEventListener('pointermove',e=>{if(tc)tilt(e)},{passive:true});
['pointerup','pointercancel','pointerleave'].forEach(n=>addEventListener(n,rs,{passive:true}));
}
function count(el){const s=el.textContent.trim();if(el.dataset.c)return;el.dataset.c=1;if(reduce||!/^\d{1,5}$/.test(s))return;const n=+s,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3);el.textContent=Math.round(n*e);if(k<1)requestAnimationFrame(f)})(t0)}
const main=document.getElementById('main');
new MutationObserver(()=>main.querySelectorAll('.stat-num:not([data-c])').forEach(count)).observe(main,{childList:true,subtree:true});
})();
</script>
